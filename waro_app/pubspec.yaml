name: waro_app
description: WARO - Warung Obrolan. Aplikasi chat offline-first untuk Indonesia.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database lokal
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.3

  # Audio recording & playback
  record: ^5.0.0
  audioplayers: ^5.2.0

  # Background sync
  workmanager: ^0.5.0

  # Network
  dio: ^5.3.0
  connectivity_plus: ^5.0.0

  # UI & State Management
  provider: ^6.0.5
  flutter_local_notifications: ^16.0.0

  # Google Drive Backup
  google_sign_in: ^6.1.0
  googleapis: ^11.0.0
  googleapis_auth: ^1.4.0

  # Enkripsi
  encrypt: ^5.0.1
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.18.1
  device_info_plus: ^9.0.0
  shared_preferences: ^2.2.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
